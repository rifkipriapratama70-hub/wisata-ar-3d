<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisata AR 3D</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 20px; 
      background: #111; 
      color: #fff; 
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card {
      background: #222;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .card h3 {
      margin-top: 0;
      color: #00d2ff;
    }
    iframe { 
      width: 100%; 
      height: 350px; 
      border: 0; 
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Galeri Wisata 3D</h1>

  <div class="grid">
    <!-- Model 1: T-Rex -->
    <div class="card">
      <h3>Patung Dinosaurus</h3>
      <iframe src="https://sketchfab.com/models/e86c9577467c49b8a66d591d330daf79/embed?autostart=1&ui_theme=dark" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
    </div>

    <!-- Model 2: Rumah Joglo -->
    <div class="card">
      <h3>Joglo</h3>
      <iframe src="https://sketchfab.com/models/5f975e24d4004fb6a505ce92088923c8/embed?autostart=1&ui_theme=dark" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
    </div>

    <!-- Model 3: Dwarapala Singasari -->
    <div class="card">
      <h3>Patung Dwarapala</h3>
      <iframe src="https://sketchfab.com/models/a953ad06f4844738aea93974d5288ab6/embed?autostart=1&ui_theme=dark" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
    </div>
  </div>

</body>
</html>
